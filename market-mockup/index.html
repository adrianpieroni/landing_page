<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda Demo - Indumentaria</title>
    <link rel="stylesheet" href="style.css">
    <meta name="description" content="Desarrollamos páginas web profesionales para negocios. Diseño rápido, moderno y optimizado para celulares. ¡Solicitá tu presupuesto gratis!">

    <meta property="og:title" content="Apex Digital | Llevá tu negocio al mundo digital">
    <meta property="og:description" content="Diseño de páginas web profesionales optimizadas para celulares.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="TU_URL_AQUI">
    </head>
<body>

    <!-- Encabezado de la Tienda -->
    <header class="store-header">
        <div class="logo">URBAN SKILLS</div>
        <div class="cart-icon">🛒 <span id="cart-count">0</span></div>
    </header>

    <!-- Banner Principal -->
    <section class="store-hero">
        <h1>Nueva Colección de Invierno</h1>
        <p>Envíos a todo el país y 3 cuotas sin interés.</p>
    </section>

    <!-- Grilla de Productos -->
        <main class="products-grid">
            <!-- Producto 1 -->
            <div class="product-card">
                <img src="https://images.unsplash.com/photo-1551028719-00167b16eac5?w=500&auto=format&fit=crop&q=80" alt="Campera Bomber Black" class="product-image">
                <div class="product-info">
                    <h3>Campera Bomber Black</h3>
                    <p class="price">$45.000</p>
                    <button class="btn-add" onclick="agregarAlCarrito()">Agregar al carrito</button>
                </div>
            </div>

            <!-- Producto 2 -->
            <div class="product-card">
                <img src="./images/canguro_overzise.jpg">
                <div class="product-info">
                    <h3>Canguro Oversize Grey</h3>
                    <p class="price">$32.000</p>
                    <button class="btn-add" onclick="agregarAlCarrito()">Agregar al carrito</button>
                </div>
            </div>

            <!-- Producto 3 -->
            <div class="product-card">
                <img src="./images/pantalon_cargo_olive.jpg">
                <div class="product-info">
                    <h3>Pantalón Cargo Olive</h3>
                    <p class="price">$38.000</p>
                    <button class="btn-add" onclick="agregarAlCarrito()">Agregar al carrito</button>
                </div>
            </div>
        </main>

    <!-- Un toque de JS interactivo rápido -->
    <script>
        let contador = 0;
        function agregarAlCarrito() {
            contador++;
            document.getElementById('cart-count').innerText = contador;
        }
    </script>
</body>
</html>
